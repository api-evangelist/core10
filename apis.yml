aid: core10
name: Core10
description: 'Core10, Inc. is a U.S.-based fintech software development and API integration
  firm founded in 2016 by Lee Farabaugh and Jeff Martin, headquartered in Franklin, Tennessee
  with delivery centers in Martin, Tennessee and Huntington, West Virginia, built on a
  domestic-outsourcing model it trademarked as Hereshore(R). Core10 wrote custom software,
  core-banking integrations and API layers for community banks, credit unions and fintechs,
  and acquired Accrue Technologies in 2021 to add a Salesforce-based digital lending, account
  opening and treasury onboarding platform. In January 2024 it spun its implementation
  practice out as Monarch, and the Core10 brand has since been retired: core10.io now
  301-redirects to monarchfts.com, where Monarch operates as an Intapp DealCloud
  implementation, configuration and managed-services consultancy for private capital firms,
  while the Accrue platform trades independently at getaccrue.com under its own leadership.
  Core10 built API integrations for other companies for nearly a decade but never published a
  developer program, public API, SDK or machine-readable contract of its own, and as of
  2026-08-11 neither successor brand does either.'
